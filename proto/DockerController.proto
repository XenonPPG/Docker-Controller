syntax = "proto3";

package DockerController;

import "google/protobuf/empty.proto";
import "proto/resources.messages.proto";

option go_package = "DockerController/gen/docker_controller_v1";

service DockerService {
  rpc GetInfo(google.protobuf.Empty) returns (DockerInfo);
  rpc GetVersion(google.protobuf.Empty) returns (DockerVersion);
  rpc GetResourceUsage(google.protobuf.Empty) returns (ResourceUsage);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message DockerInfo {
  string id = 1;
  int32 containers_running = 2;
  int32 containers_stopped = 3;
  int32 images_count = 4;
  string os = 5;
  string architecture = 6;
  uint64 total_memory = 7;
  int32 cpus = 8;
}

message DockerVersion {
  string version = 1;
  string api_version = 2;
  string go_version = 3;
}

message StreamEventsRequest {
  repeated string types = 1;
  repeated string actions = 2;
}

message Event {
  string type = 1;
  string action = 2;
  string actor_id = 3;
  string actor_name = 4;
  int64 time = 5;
  map<string, string> attributes = 6;
}